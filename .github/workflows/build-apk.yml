name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          rm -rf SpeedCluster
          unzip -q -o SpeedCluster.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: SpeedCluster
        run: gradle assembleDebug --no-daemon

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Speed Cluster APK ${{ github.run_number }}
          files: SpeedCluster/app/build/outputs/apk/debug/app-debug.apk
